name: Validate and publish beta release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - bridge_x/__init__.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-bridge-x
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Preserve committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q -ra
      - run: python LOCAL_HTTP_ACCEPTANCE.py
      - run: python -m tools.native_css_acceptance
      - name: Build and audit complete archive
        shell: pwsh
        run: |
          python -m tools.build_release --output-dir artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "from bridge_x import __version__; print(__version__)"
          python -m tools.audit_release "artifacts/bridge-x-$version-complete.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish immutable versioned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $version = python -c "from bridge_x import __version__; print(__version__)"
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release already exists; published assets were not changed."
            exit 0
          }
          gh release create $tag "artifacts/bridge-x-$version-complete.zip" "artifacts/SHA256SUMS.txt" --target $env:RELEASE_COMMIT --title "Bridge X $version" --notes-file RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
