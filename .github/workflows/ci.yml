name: Offline regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Preserve committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned test environment
        run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q bridge_x bridge_x_test_runner tests tools
      - name: Run complete offline regression suite
        run: python -m pytest -q -ra
      - name: Check real temporary HTTP and SQLite cleanup
        run: python LOCAL_HTTP_ACCEPTANCE.py
      - name: Check scripted native tools with real temporary files
        run: python -m tools.native_css_acceptance
      - name: Check long native workflow and SQLite restart continuity
        run: python -m tools.continuity_acceptance
      - name: Check offline doctor without using operator configuration
        run: python -m bridge_x doctor --provider fake --port 0
      - name: Build complete release and audit its contents
        shell: pwsh
        run: |
          python -m tools.build_release --output-dir artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "from bridge_x import __version__; print(__version__)"
          python -m tools.audit_release "artifacts/bridge-x-$version-complete.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify complete archive in a clean environment
        shell: pwsh
        run: |
          $version = python -c "from bridge_x import __version__; print(__version__)"
          python -m tools.verify_release "artifacts/bridge-x-$version-complete.zip" --work-dir "$env:RUNNER_TEMP/bridge-x-pr-zip-verification"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified review archive and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-x-continuity-candidate
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
